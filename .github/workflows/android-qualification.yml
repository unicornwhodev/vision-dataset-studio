name: UWD Android qualification
# Manual qualification only. No repository release or Hugging Face write operation.
on:
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: 'Install and run instrumented tests on dedicated API 28 and 35 emulators'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: android-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Explicit licence acceptance in the operator-triggered qualification workflow.
          accept-android-sdk-licenses: true
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic
      - name: Verify source identity and build tooling policies
        run: |
          python3 tools/qa/test_identity.py
          python3 tools/qa/test_build_evidence.py
      - name: Install exact compile platform and build tools
        run: |
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
          sdkmanager --list_installed > sdk-packages.txt
      - name: Build APKs, run dependency tests, lint and verify signatures
        env:
          VDS_GRADLE_BIN: gradle
        run: bash tools/build_android.sh
      - name: Retain build evidence even after a failed check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwd-android-build
          if-no-files-found: warn
          retention-days: 14
          path: dist/android/
      - name: Retain generated Room schemas and dependency test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwd-android-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
            sdk-packages.txt
  instrumented:
    needs: build
    if: ${{ inputs.run_device_tests }}
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: uwd-android-build
          path: dist/android/
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the exact built APKs and run all instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SERIAL: emulator-5554
          VDS_ALLOW_TEST_INSTALL: '1'
          VDS_EVIDENCE_DIR: test-results/device-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          disable-animations: true
          script: bash tools/qa/run_device_qualification.sh
      - name: Retain installation logs, screenshots and device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwd-android-device-${{ matrix.api }}
          retention-days: 14
          if-no-files-found: warn
          path: test-results/device-${{ matrix.api }}/
